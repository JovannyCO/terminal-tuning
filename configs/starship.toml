"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
[](fg:#FF6D00)\
$os\
$username\
$hostname\
[](fg:#FF6D00) [](fg:#02BCF9)\
$directory\
$git_branch\
$git_status\
$fill\
[](fg:#2B2930)\
$nodejs\
$rust\
$golang\
$java\
$cmd_duration\
[](fg:#2B2930 bg:#FF6D00)\
$time\
[](fg:#FF6D00)\
$line_break\
[╰ ](dim #FF6D00)$character """

[os]
disabled = false
format = "[ $symbol ](bg:#FF6D00 fg:#1C1B1F bold)"

[os.symbols]
Ubuntu   = "\uF31B"
Debian   = "\uF306"
Windows  = "󰍲"
Linux    = "\uF17C"
Macos    = "󰀵"
Unknown  = "\uF17C"

[username]
show_always = true
format = "[ $user](bg:#FF6D00 fg:#1C1B1F bold)"
style_user = "bg:#FF6D00 fg:#1C1B1F bold"
style_root = "bg:#CF6679 fg:#FFFFFF bold"

[hostname]
ssh_only = false
format = "[@$hostname ](bg:#FF6D00 fg:#1C1B1F bold)"

[directory]
format = "[ 󰉋 $path$read_only ]($style)[](fg:#02BCF9)"
style = "bg:#02BCF9 fg:#1C1B1F bold"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bg:#02BCF9 fg:#1C1B1F"

[git_branch]
format = "[](fg:#00897B)[ $symbol$branch ]($style)"
style = "bg:#00897B fg:#FFFFFF bold"
symbol = "\uE0A0 "
truncation_length = 50

[git_status]
format = "[$all_status$ahead_behind]($style)[](fg:#00897B)"
style = "bg:#00897B fg:#FFD740 bold"
conflicted  = " \uF06A"
ahead       = " \uF062 ${count} "
behind      = " \uF063 ${count} "
diverged    = " \uF062 ${ahead_count} \uF063 ${behind_count} "
untracked   = " \uF128"
stashed     = " 󰏗"
modified    = " \uF044"
staged      = " \uF00C"
renamed     = " »"
deleted     = " \uF1F8"

[fill]
symbol = "─"
style  = "#49454F"

[nodejs]
format = "[ $symbol$version ]($style)"
style  = "bg:#2B2930 fg:#68A063 bold"
symbol = "󰎙 "

[rust]
format = "[ $symbol$version ]($style)"
style  = "bg:#2B2930 fg:#FF6B35 bold"
symbol = "󱘗 "

[golang]
format = "[ $symbol$version ]($style)"
style  = "bg:#2B2930 fg:#00ACD7 bold"
symbol = "\uE627 "

[java]
format = "[ $symbol$version ]($style)"
style  = "bg:#2B2930 fg:#ED8B00 bold"
symbol = "\uE738 "

[cmd_duration]
format     = "[ 󱗻 $duration ]($style)"
style      = "bg:#2B2930 fg:#FFB74D"
min_time   = 2_000
show_milliseconds = false

[time]
disabled     = false
format       = "[ 󱑂 $time ]($style)"
style        = "bg:#FF6D00 fg:#1C1B1F bold"
time_format  = "%H:%M:%S"

[character]
success_symbol  = "[❯](bold #69F0AE)"
error_symbol    = "[❯](bold #CF6679)"
vimcmd_symbol   = "[❮](bold #02BCF9)"
